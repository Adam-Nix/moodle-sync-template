; Copy this file to config.ini and fill in your own values.
; config.ini is ignored by git, so your token and share stay on your PC.

[User]
program = Your Programme Name
server = https://moodle.example.ie
; Moodle -> Preferences -> Security keys
token = your-moodle-token

[Deadlines]
; Optional - work with no fixed deadline counts down to this date
semester_end = 2026-12-18

[Folders]
; This PC's course folder (created if missing). Moodle files go in its master folder.
; Leave out to use Documents\Moodle; the first run asks if it isn't set.
local = C:\Users\you\Documents\Moodle

[Courses]
; The Moodle category that holds this year's courses (the first run lists yours and asks).
; Blank puts every course in the master folder.
current_category =
; Categories to ignore, comma separated
skip_categories =

[Network]
; Optional - leave out to keep files local only. Each is another copy of the whole
; course folder, kept identical on a sync; the Moodle files go in its master folder.
share = \\server\share\Moodle
; OneDrive is found automatically (same folder name as above). Set a path here to
; override it, or leave it blank to switch it off.
; onedrive = %OneDrive%\Moodle

; Lecture slides that live on a course website instead of Moodle.  One section per
; site; the pages are printed to PDF (Chromium, via Playwright) into the named
; course folder in the master folder, so the usual sync then sends them everywhere:
;     pip install playwright
;     python -m playwright install chromium
[Webpage mycourse]
; Course folder inside the master folder that the PDFs are saved in
course = your-course-folder-name
; Page that links to the decks; any new week linked from here is picked up on its own
index = https://slides.example.com/course/slides/
; Decks to always print, in case the index can't be read (names or full URLs)
pages = week01.html, week02.html, week03.html
; Subfolder for the PDFs inside the course folder (leave blank for the folder itself)
subfolder = slides
; A site that asks for a login reads it from secrets.ini, not from here
; reveal.js' printable view; blank for a site that prints fine as it is
print_query = print-pdf
